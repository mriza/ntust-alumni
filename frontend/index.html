<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumni NTUST Indonesia</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="#/" class="nav-brand">🎓 Alumni NTUST Indonesia</a>
            <div class="nav-links" id="navLinks">
                <!-- Nav links dinamis: ditambahkan oleh JS -->
            </div>
            <div class="nav-auth" id="navAuth">
                <!-- Login/Register atau Logout -->
            </div>
        </div>
    </nav>

    <main id="app"></main>

    <!-- Modal Verifikasi -->
    <div id="verifyModal" class="modal" style="display: none;">
        <div class="modal-content">
            <h2>Verifikasi Akun</h2>
            <p>Tambahkan email <code>@mail.ntust.edu.tw</code> milik Anda untuk memverifikasi akun. Kami akan mengirimkan kode OTP ke email tersebut.</p>
            <form id="verifyRequestForm">
                <label>Email NTUST</label>
                <input type="email" id="verifyEmailInput" required>
                <button type="submit" class="btn btn-primary">Kirim OTP</button>
            </form>
            <div id="verifyEmailStatus"></div>
            <div class="divider">ATAU</div>
            <form id="verifyForm">
                <label>Kode OTP</label>
                <input type="text" id="verifyOtpInput" placeholder="Masukkan kode OTP">
                <label>NIM</label>
                <input type="text" id="verifyNimInput" placeholder="Masukkan NIM">
                <button type="submit" class="btn btn-primary">Verifikasi</button>
            </form>
            <div id="verifyStatus"></div>
            <button id="closeVerifyModal" class="btn btn-secondary">Tutup</button>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
