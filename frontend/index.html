<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Alumni NTUST Indonesia — Portal Resmi &amp; Forum Q&amp;A</title>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/theme.js"></script>
</head>
<body>
    <header class="ant-header" id="siteHeader">
        <nav class="ant-nav-container" aria-label="Navigasi Utama">
            <a href="#/" class="ant-brand">
                <span class="ant-brand-mark" aria-hidden="true">
                    <svg class="feature-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                        <path d="M6 12v5c3 3 9 3 12 0v-5"/>
                    </svg>
                </span>
                <span class="ant-brand-text">
                    <span>Alumni NTUST Indonesia</span>
                    <span class="ant-brand-sub">Portal Alumni &amp; Forum Q&amp;A</span>
                </span>
            </a>

            <button type="button" id="mobileNavToggle" class="ant-mobile-toggle" aria-label="Buka menu navigasi" aria-expanded="false">
                <svg class="feature-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <path d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
            </button>

            <div class="ant-nav-links" id="navLinks"></div>

            <div class="ant-nav-right">
                <span id="healthIndicator" class="health-indicator" title="Status Server">Memeriksa...</span>

                <div class="ant-theme-segmented" id="themeSwitcher" role="radiogroup" aria-label="Pilih tema tampilan">
                    <button type="button" class="ant-theme-btn" data-theme-value="light" role="radio" aria-checked="false" title="Tema Terang">
                        <svg class="ant-theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
                        </svg>
                        <span class="ant-theme-label">Light</span>
                    </button>
                    <button type="button" class="ant-theme-btn" data-theme-value="dark" role="radio" aria-checked="false" title="Tema Gelap">
                        <svg class="ant-theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
                        </svg>
                        <span class="ant-theme-label">Dark</span>
                    </button>
                    <button type="button" class="ant-theme-btn" data-theme-value="system" role="radio" aria-checked="true" title="Ikuti Sistem">
                        <svg class="ant-theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/>
                        </svg>
                        <span class="ant-theme-label">System</span>
                    </button>
                </div>

                <div class="ant-nav-auth" id="navAuth"></div>
            </div>
        </nav>
    </header>

    <div id="toastContainer" class="ant-message-container" aria-live="polite"></div>

    <main id="app" class="ant-content" tabindex="-1"></main>

    <footer class="ant-footer">
        <div class="ant-footer-inner">
            <div>
                <strong>Alumni NTUST Indonesia</strong>
                <p class="ant-footer-copy">Wadah resmi kolaborasi alumni National Taiwan University of Science and Technology di Indonesia.</p>
            </div>
            <div class="ant-footer-links">
                <a href="#/">Beranda</a>
                <a href="#/directory">Direktori</a>
                <a href="#/forum">Forum Q&amp;A</a>
                <a href="#/subgroups">Subgroup Wilayah</a>
            </div>
        </div>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
