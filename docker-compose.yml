version: "3.8"

services:
  couchdb:
    image: docker.io/library/couchdb:3.3
    container_name: ntust-couchdb
    ports:
      - "5984:5984"
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=<COUCHDB_PASSWORD>
    volumes:
      - couchdb-data:/opt/couchdb/data
    command: >
      -c couchdb_database_dir=/opt/couchdb/data
      -c view_index_dir=/opt/couchdb/data

  backend:
    build: ./backend
    container_name: ntust-backend
    ports:
      - "8080:8080"
    environment:
      - COUCHDB_URL=http://admin:<COUCHDB_PASSWORD>@couchdb:5984
      - JWT_SECRET=<JWT_SECRET>
      - PORT=8080
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - BREVO_FROM_EMAIL=noreply@ntust-alumni.id
      - BREVO_FROM_NAME=Alumni NTUST Indonesia
    depends_on:
      - couchdb
    restart: unless-stopped

  frontend:
    image: docker.io/library/nginx:alpine
    container_name: ntust-frontend
    ports:
      - "8081:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:z
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  couchdb-data:
