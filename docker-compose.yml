version: "3.8"

services:
  couchdb:
    image: docker.io/library/couchdb:3.3
    container_name: ntust-couchdb
    env_file:
      - .env
    ports:
      - "5984:5984"
    environment:
      - COUCHDB_USER=${COUCHDB_USER:?COUCHDB_USER is required in .env}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD:?COUCHDB_PASSWORD is required in .env}
    volumes:
      - couchdb-data:/opt/couchdb/data
    command: >
      -c couchdb_database_dir=/opt/couchdb/data
      -c view_index_dir=/opt/couchdb/data

  backend:
    build: ./backend
    container_name: ntust-backend
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      - COUCHDB_URL=http://${COUCHDB_USER:?COUCHDB_USER is required in .env}:${COUCHDB_PASSWORD:?COUCHDB_PASSWORD is required in .env}@couchdb:5984
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required in .env}
      - PORT=${PORT:-8080}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8081}
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - BREVO_FROM_EMAIL=${BREVO_FROM_EMAIL:-ntust-alumni-verification@cerdas.club}
      - BREVO_FROM_NAME=${BREVO_FROM_NAME:-Alumni NTUST Indonesia}
      - VERIFICATION_ALLOWED_DOMAINS=${VERIFICATION_ALLOWED_DOMAINS:-@mail.ntust.edu.tw}
      - BREVO_SMS_SENDER=${BREVO_SMS_SENDER:-NTUSTAlumni}
      - BREVO_WHATSAPP_SENDER=${BREVO_WHATSAPP_SENDER:-}
      - BREVO_WHATSAPP_TEMPLATE_ID=${BREVO_WHATSAPP_TEMPLATE_ID:-}
    depends_on:
      - couchdb
    restart: unless-stopped

  frontend:
    image: docker.io/library/nginx:alpine
    container_name: ntust-frontend
    ports:
      - "8081:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro,z
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro,z
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  couchdb-data:
